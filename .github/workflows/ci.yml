name: CI

on:
  pull_request:
    branches: [main]

# PR checks run with no AWS credentials on purpose: anything a PR workflow can
# read, unmerged PR code can read. Environment secrets belong to the trusted
# deploy workflows (deploy.yml) only. See AGENTS.md -> Environment variables.
# Read-only by default. Only gitleaks comments on the PR, so only it gets
# pull-requests: write. A failed install fails the job: falling back to
# `pnpm approve-builds --all` would run every dependency's install script,
# which is what the allowBuilds list exists to stop.
permissions:
  contents: read

jobs:
  gitleaks:
    continue-on-error: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Org-owned repo, so the action wants a license. Kept as a repository
          # secret rather than an AWS one: a PR-safe CI credential, and this job
          # must not be able to reach Secrets Manager.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  lint:
    continue-on-error: false
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/startline?schema=public
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    continue-on-error: false
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/startline?schema=public
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
      - run: npx prisma generate
      - run: pnpm typecheck

  build:
    continue-on-error: false
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/startline?schema=public
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
      - run: npx prisma generate
      - run: pnpm build

  test:
    continue-on-error: false
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/startline?schema=public
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
      - run: npx prisma generate
      - run: pnpm test

  e2e:
    continue-on-error: false
    runs-on: ubuntu-latest
    # Four shards, each with its own Postgres and dev server. A dev server's
    # heap grows with every page it compiles, and one running the whole suite
    # (or half of it) passed next dev's memory restart line even with a 10 GB
    # heap, so the tests in flight failed on dropped connections. Playwright
    # shards by file here (fullyParallel is off).
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: e2e (${{ matrix.shard }}/4)
    # Hermetic: local Postgres, no AWS secrets. Stripe's live-lifecycle and the
    # real-Cognito auth specs guard on their own env vars and skip when those
    # are absent, which is what we want here. Turnstile is absent, so the
    # server fails open as the specs expect.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/startline?schema=public
      NEXT_PUBLIC_AWS_REGION: ap-southeast-2
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      # A fake Cognito domain: social-sign-in.spec.ts intercepts the redirect to
      # it and only checks the request. No spec gates on these, so they are safe
      # at job level. The pool and client id are NOT here — see the dev-server
      # step below.
      NEXT_PUBLIC_COGNITO_DOMAIN: sl-e2e.auth.ap-southeast-2.amazoncognito.com
      NEXT_PUBLIC_SOCIAL_SIGN_IN: google,apple
      # Signs the "Add to my profile" link; profile-race-history.spec.ts signs
      # one with the same value. A test value, not a credential.
      ENTRY_CLAIM_SECRET: e2e-entry-claim-secret
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: startline
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check for sensitive file changes
        shell: bash
        run: |
          CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }}...HEAD \
            -- prisma/seed.ts scripts/ 2>/dev/null || true)
          if [ -n "$CHANGED" ]; then
            echo "::warning::These files changed in this PR — review before merging:"
            echo "$CHANGED"
          fi
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install chromium
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Seed database
        shell: bash
        run: npx prisma db seed
      - name: Start Next.js dev server
        shell: bash
        run: |
          # The app needs a non-empty pool and client id to build an authorize
          # URL at all; social-sign-in.spec.ts then intercepts the redirect.
          # Output goes to a file: a background process's output is lost once
          # this step ends, which hid why the server stalled and dropped
          # connections mid-run. Printed below when the e2e run fails.
          #
          # next dev restarts its server once the heap passes 80% of the limit,
          # which it sets to half the runner's memory. Late in the suite that
          # dropped connections mid-test (ECONNRESET, then ECONNREFUSED until it
          # came back). The larger heap plus sharding (see the job's strategy)
          # keeps each server under it; the heap alone stopped being enough.
          NODE_OPTIONS=--max-old-space-size=10240 NEXT_PUBLIC_COGNITO_USER_POOL_ID=ap-southeast-2_test NEXT_PUBLIC_COGNITO_CLIENT_ID=testclientid NEXT_PUBLIC_COGNITO_LINK_CLIENT_ID=testlinkclientid NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN=pk_test pnpm dev -p 3000 > "$RUNNER_TEMP/next-dev.log" 2>&1 &
          npx wait-on http://localhost:3000/admin/login --timeout 60000
      - run: pnpm test:e2e --shard=${{ matrix.shard }}/4
      # A restart drops whatever was in flight, so say so even when the
      # retries happened to absorb it.
      - name: Check the dev server never restarted for memory
        if: always()
        shell: bash
        run: |
          if grep -q "approaching the used memory threshold" "$RUNNER_TEMP/next-dev.log"; then
            echo "::warning::next dev restarted for memory during this shard. Add a shard to the e2e matrix."
          fi
      - name: Dev server log
        if: failure()
        shell: bash
        run: grep -vE '^\s*(GET|POST|PUT|PATCH|DELETE|HEAD) /' "$RUNNER_TEMP/next-dev.log" | tail -n 400
