name: CI

on:
  pull_request:
    branches: [main]

# PR checks run with no AWS credentials on purpose: anything a PR workflow can
# read, unmerged PR code can read. Environment secrets belong to the trusted
# deploy workflows (deploy.yml) only. See AGENTS.md -> Environment variables.
permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  gitleaks:
    continue-on-error: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Org-owned repo, so the action wants a license. Kept as a repository
          # secret rather than an AWS one: a PR-safe CI credential, and this job
          # must not be able to reach Secrets Manager.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  lint:
    continue-on-error: false
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/startline?schema=public
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile || pnpm approve-builds --all
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    continue-on-error: false
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/startline?schema=public
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile || pnpm approve-builds --all
      - run: pnpm install --frozen-lockfile
      - run: npx prisma generate
      - run: pnpm typecheck

  build:
    continue-on-error: false
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/startline?schema=public
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile || pnpm approve-builds --all
      - run: pnpm install --frozen-lockfile
      - run: npx prisma generate
      - run: pnpm build

  test:
    continue-on-error: false
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/startline?schema=public
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile || pnpm approve-builds --all
      - run: pnpm install --frozen-lockfile
      - run: npx prisma generate
      - run: pnpm test

  e2e:
    continue-on-error: false
    runs-on: ubuntu-latest
    # Hermetic: local Postgres, no AWS secrets. Stripe's live-lifecycle and the
    # real-Cognito auth specs guard on their own env vars and skip when those
    # are absent, which is what we want here. Turnstile is absent, so the
    # server fails open as the specs expect.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/startline?schema=public
      NEXT_PUBLIC_AWS_REGION: ap-southeast-2
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      # A fake Cognito domain: social-sign-in.spec.ts intercepts the redirect to
      # it and only checks the request. No spec gates on these, so they are safe
      # at job level. The pool and client id are NOT here — see the dev-server
      # step below.
      NEXT_PUBLIC_COGNITO_DOMAIN: sl-e2e.auth.ap-southeast-2.amazoncognito.com
      NEXT_PUBLIC_SOCIAL_SIGN_IN: google,apple
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: startline
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check for sensitive file changes
        shell: bash
        run: |
          CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }}...HEAD \
            -- prisma/seed.ts scripts/ 2>/dev/null || true)
          if [ -n "$CHANGED" ]; then
            echo "::warning::These files changed in this PR — review before merging:"
            echo "$CHANGED"
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile || pnpm approve-builds --all
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install chromium
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Seed database
        shell: bash
        run: npx prisma db seed
      - name: Start Next.js dev server
        shell: bash
        run: |
          # The app needs a non-empty pool and client id to build an authorize
          # URL at all; social-sign-in.spec.ts then intercepts the redirect.
          NEXT_PUBLIC_COGNITO_USER_POOL_ID=ap-southeast-2_test NEXT_PUBLIC_COGNITO_CLIENT_ID=testclientid NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN=pk_test pnpm dev -p 3000 &
          npx wait-on http://localhost:3000/admin/login --timeout 60000
      - run: pnpm test:e2e
